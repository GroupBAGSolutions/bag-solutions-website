# main solo recibe PR desde dev. Este check es obligatorio en la regla de protección de main.
name: Flujo de ramas

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  main-desde-dev:
    name: PR a main solo desde dev
    runs-on: ubuntu-latest
    steps:
      - name: Verificar la rama de origen
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::main solo acepta PR desde dev. Este PR viene de '$HEAD_REPO:$HEAD_REF'. Ábrelo hacia dev."
            exit 1
          fi
          echo "Origen correcto: dev"
